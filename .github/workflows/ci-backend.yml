name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Samhallsinformation/backend/**"
      - "Samhallsinformation/backend.Tests/**"
      - "Samhallsinformation/Samhallsinformation.slnx"
      - ".github/workflows/ci-backend.yml"
      # Frontend-filer som backend-tester läser (FeatureFlagFrontendParityTests,
      # ProvaSjalvParityTests). Utan dem blir en frontend-PR grön fast den bryter testerna.
      - "Samhallsinformation/frontend/src/lib/featureFlags.ts"
      - "Samhallsinformation/frontend/src/lib/provaSjalv.ts"
  pull_request:
    branches: [main]
    paths:
      - "Samhallsinformation/backend/**"
      - "Samhallsinformation/backend.Tests/**"
      - "Samhallsinformation/Samhallsinformation.slnx"
      - ".github/workflows/ci-backend.yml"
      # Frontend-filer som backend-tester läser (FeatureFlagFrontendParityTests,
      # ProvaSjalvParityTests). Utan dem blir en frontend-PR grön fast den bryter testerna.
      - "Samhallsinformation/frontend/src/lib/featureFlags.ts"
      - "Samhallsinformation/frontend/src/lib/provaSjalv.ts"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          include-prerelease: true

      - name: Format
        working-directory: Samhallsinformation
        run: dotnet format whitespace --verify-no-changes

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # V4-6b: sviten innehåller nu fyra Postgres-baserade tester (Trait "Category"="Postgres",
    # Testcontainers.PostgreSql — se backend.Tests/PostgresFixture.cs). De kräver Docker, som
    # ubuntu-latest-runnern bekräftat har (2026-09-27, engångskörning av `docker run --rm
    # hello-world` i en nu borttagen diagnostik-PR). "Test"-steget nedan kör ALLA tester
    # (ingen --filter) med avsikt — CI ska alltid köra Postgres-testerna. En lokal utvecklare
    # utan Docker kör i stället `dotnet test --filter "Category!=Postgres"` för resten av sviten.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          include-prerelease: true

      - name: Restore
        working-directory: Samhallsinformation
        run: dotnet restore

      - name: Build
        working-directory: Samhallsinformation
        run: dotnet build --no-restore --configuration Release

      - name: Test (alla tester, inkl. Postgres/Testcontainers — kräver Docker)
        working-directory: Samhallsinformation
        run: dotnet test --no-build --configuration Release
